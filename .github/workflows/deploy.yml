name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  PROJECT_DIR: /home/deploy/olnk-tr
  COMPOSE_FILE: docker-compose.yml
  APP_NAME: olnk-tr

jobs:
  deploy:
    name: Sunucuya dağıt
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://olnk.tr

    steps:
      - name: Sunucuya bağlan ve dağıt
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -euo pipefail

            echo "[1/7] Disk alanı kontrol ediliyor..."
            AVAILABLE=$(df -BG / | awk 'NR==2 {print $4}' | tr -dc '0-9')
            if [ "${AVAILABLE:-0}" -lt 5 ]; then
              docker system prune -af || true
            fi

            echo "[2/7] Proje klasörü hazırlanıyor..."
            mkdir -p "$(dirname "$PROJECT_DIR")"
            if [ ! -d "$PROJECT_DIR/.git" ]; then
              cd "$(dirname "$PROJECT_DIR")"
              git clone --branch main --recurse-submodules "git@github.com:${{ github.repository }}.git" "$APP_NAME"
            fi
            cd "$PROJECT_DIR"

            echo "[3/7] Son sürüm çekiliyor..."
            git fetch --prune --tags origin
            git reset --hard "origin/${{ github.ref_name }}"
            git submodule update --init --recursive

            echo "[4/7] .env dosyası kontrol ediliyor..."
            if [ ! -f .env ]; then
              echo "HATA: .env dosyası bulunamadı. Lütfen sunucuda /home/deploy/olnk-tr/.env oluşturun." >&2
              exit 1
            fi

            echo "[5/7] Eski container durduruluyor..."
            docker compose -f "$COMPOSE_FILE" down --remove-orphans || true

            echo "[6/7] Image'lar yeniden build ediliyor..."
            docker compose -f "$COMPOSE_FILE" build --pull --no-cache

            echo "[7/7] Servisler başlatılıyor..."
            docker compose -f "$COMPOSE_FILE" up -d

            echo "Eski image'lar temizleniyor..."
            docker image prune -af >/dev/null || true

            echo "Bekleniyor..."
            sleep 10

            echo "Container durumları:"
            docker compose -f "$COMPOSE_FILE" ps

            if docker compose -f "$COMPOSE_FILE" ps | grep -q "Exit\|exited\|dead"; then
              echo "HATA: Bir veya daha fazla container çöktü." >&2
              docker compose -f "$COMPOSE_FILE" logs --tail=200
              exit 1
            fi

            echo "Dağıtım tamamlandı: $(git rev-parse --short HEAD)"

      - name: Dağıtım durumu bildiriliyor
        if: always()
        uses: 8398a7/action-slack@v3
        with:
          text: |
            ${{ job.status == 'success' && '✅' || '❌' }} Deploy ${{ job.status }} — `${{ github.ref_name }}` @ `${{ github.sha }}`
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
        continue-on-error: true
