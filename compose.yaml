name: olnktr

x-app-environment: &app-environment
  AUTH_SECRET: ${AUTH_SECRET:-docker-local-auth-secret-change-before-production}
  AUTH_URL: ${DOCKER_APP_URL:-http://localhost:3000}
  CRON_SECRET: ${CRON_SECRET:-docker-local-cron-secret-change-before-production}
  DATABASE_URL: postgresql://${POSTGRES_USER:-olnktr}:${POSTGRES_PASSWORD:-olnktr}@database:5432/${POSTGRES_DB:-olnktr}
  EMAIL_FROM: ${DOCKER_EMAIL_FROM:-olnk.tr <giris@olnk.local>}
  EMAIL_SERVER: ${DOCKER_EMAIL_SERVER:-smtp://mailpit:1025}
  NEXT_PUBLIC_APP_URL: ${DOCKER_APP_URL:-http://localhost:3000}
  TRUSTED_IP_HEADER: none

services:
  database:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-olnktr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-olnktr}
      POSTGRES_USER: ${POSTGRES_USER:-olnktr}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres-data:/var/lib/postgresql/data

  mailpit:
    image: axllent/mailpit:v1.27.8
    restart: unless-stopped
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: 500
    ports:
      - "127.0.0.1:8025:8025"
    volumes:
      - mailpit-data:/data

  migrate:
    build:
      context: .
      target: migrator
    environment: *app-environment
    depends_on:
      database:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      target: runner
      args:
        NEXT_PUBLIC_APP_URL: ${DOCKER_APP_URL:-http://localhost:3000}
    restart: unless-stopped
    environment: *app-environment
    depends_on:
      database:
        condition: service_healthy
      mailpit:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  mailpit-data:
  postgres-data:
