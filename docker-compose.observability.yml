# Optional observability add-on (OpenTelemetry Collector).
#
#   docker compose -f docker-compose.yml -f docker-compose.observability.yml up -d otel-collector
#   OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:14318   # host processes
#   OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318  # containers
services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.165.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./infrastructure/monitoring/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "127.0.0.1:${OTEL_HTTP_PORT:-14318}:4318"
    restart: unless-stopped
