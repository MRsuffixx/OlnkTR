packages:
  - "apps/*"
  - "packages/*"

# Only these dependencies may run install scripts (supply-chain hardening).
onlyBuiltDependencies:
  - esbuild
  - "@tailwindcss/oxide"
  - sharp
  - unrs-resolver

# Fail on peer dependency mismatches instead of silently installing them.
strictPeerDependencies: false
autoInstallPeers: true
